[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceflow"
version = "1.0.0"
description = "A powerful, lightweight decorator for visually tracing Python function calls and async tasks."
readme = "README.md"
authors = [
  { name = "Aarav Agarwal" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"

[project.urls]
"Homepage" = "https://github.com/Firestar3/TraceFlow"
"Bug Tracker" = "https://github.com/Firestar3/TraceFlow/issues"
