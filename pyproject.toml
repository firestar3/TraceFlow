[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceflow-py"
version = "1.8.0"
description = "A lightweight decorator for visually tracing Python function calls with indented call trees, timing, variable tracking, and async support."
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.7"
authors = [
    { name = "Aarav Agarwal" }
]
keywords = [
    "tracing",
    "debugging",
    "decorator",
    "call-tree",
    "profiling",
    "recursion",
    "async",
    "logging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Firestar3/TraceFlow"
Repository = "https://github.com/Firestar3/TraceFlow"
"Bug Tracker" = "https://github.com/Firestar3/TraceFlow/issues"

[tool.setuptools.packages.find]
where = ["src"]
